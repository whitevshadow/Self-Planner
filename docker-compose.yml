services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: self_planner
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d self_planner"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # Single root .env supplies gateway creds, models and ASR config.
    env_file: .env
    environment:
      # Container-network overrides (win over env_file). localhost inside the
      # container is the container itself, so DB/MinIO/gateway are reached over
      # docker networks by service/alias name. The gateway (litellm-app) runs in
      # its own compose project; we join its network and reach it as "app:1050".
      DATABASE_URL: postgresql+psycopg2://planner:planner@db:5432/self_planner
      MINIO_ENDPOINT: minio:9000
      LLM_BASE_URL: http://app:1050/v1
    networks:
      - default
      - gateway
    ports: ["8000:8000"]
    volumes: [hfcache:/root/.cache]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    depends_on: [backend]

networks:
  # The LLM/STT gateway (litellm-app) lives in its own compose project; join
  # its existing network so the backend reaches it as "app:1050".
  gateway:
    external: true
    name: litellm_default

volumes:
  pgdata:
  miniodata:
  hfcache:
